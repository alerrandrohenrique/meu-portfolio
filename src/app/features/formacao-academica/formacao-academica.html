<section class="caixa-principal">
  <h2>Formação Acadêmica</h2>

  <!-- Curso em andamento -->
  <div class="curso">
    <h3>{{ cursoPrincipal.nome }}</h3>
    <p>{{ cursoPrincipal.instituicao }}</p>
    <p class="status-andamento">🟡 {{ cursoPrincipal.status }}</p>
  </div>

  <!-- Cursos concluídos no SENAI -->
  <h3>Cursos Profissionalizantes</h3>
  @for (curso of cursosSENAI; track curso.nome) {
    <div class="curso">
      <h4>{{ curso.nome }}</h4>
      <p>{{ curso.instituicao }}</p>
      <p class="status-concluido">✅ {{ curso.status }}</p>
    </div>
  }
</section>
